name: Build Test APK

on:
  workflow_dispatch:

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - run: npm ci --prefix mobile

      - name: Expo prebuild TEST variant
        working-directory: mobile
        run: npx expo prebuild --clean --platform android
        env:
          TEST_BUILD: '1'
          EXPO_NO_GIT_STATUS: '1'

      - name: Build release APK with bundled JS
        working-directory: mobile/android
        run: ./gradlew assembleRelease
        env:
          TEST_BUILD: '1'

      - name: Collect APK
        shell: bash
        run: |
          APK=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "APK not found"; exit 1; fi
          cp "$APK" mobile/bayproject-test-apk.apk
          ls -lh mobile/bayproject-test-apk.apk
          echo "APK_SHA=$(sha256sum mobile/bayproject-test-apk.apk | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bayproject-test-apk
          path: mobile/bayproject-test-apk.apk
          retention-days: 14
